[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "online-class-record-helper"
version = "1.0.0"
description = "Cross-platform spreadsheet-to-web keyboard helper"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.2", "pynput==1.8.1"]

[project.scripts]
class-record-helper = "class_record_helper.app:main"

[tool.setuptools.packages.find]
include = ["class_record_helper*"]
